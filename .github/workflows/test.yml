name: test
on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:          # lets main.yml invoke this same definition

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch DST
      # Downloads the vanilla Git Store Meta source (from a fork, for backup) and applies the DST patch needed for Logic X
        run: "${{ github.workspace }}/scripts/bootstrap.sh"
      - name: Test Compile
        run: "${{ github.workspace }}/test/download.sh"
      - name: Test Verify
      # Runs every test case, so new ones need no change here. Name them
      # *.pl.t to be run with perl, or *.sh.t to be run with bash.
        run: |
          cd "${{ github.workspace }}/test"
          status=0
          for t in *.pl.t; do
            echo "# ${t}"
            PERL5LIB="${PWD}" perl "${t}" || status=1
          done
          for t in *.sh.t; do
            echo "# ${t}"
            bash "${t}" || status=1
          done
          exit $status
      - name: Shellcheck
        run: shellcheck --severity=error scripts/*.sh